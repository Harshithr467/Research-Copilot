<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Chat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <span class="sidebar-logo"> Research </span>
        <button class="btn-new-chat" id="btnNewChat">+ New Chat</button>
      </div>
      <ul class="chat-list" id="chatList"></ul>
    </aside>

    <!-- Main -->
    <main class="main">

      <!-- Top bar -->
      <div class="topbar">
        <h2 class="chat-title-label" id="chatTitleLabel">Select or start a chat</h2>
        <div class="doc-tags" id="docTags"></div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <p>Upload a document and ask a question to get started.</p>
        </div>
      </div>

      <!-- Upload bar -->
      <div class="upload-bar" id="uploadBar">
        <label class="upload-label" for="fileInput">
          📎 Attach document
          <input type="file" id="fileInput" accept=".pdf,.docx,.txt" multiple hidden />
        </label>
        <span class="upload-hint" id="uploadHint">No documents uploaded</span>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <textarea
          id="queryInput"
          placeholder="Ask a question based on your uploaded documents..."
          rows="1"
        ></textarea>
        <button class="btn-send" id="btnSend">Send</button>
      </div>

    </main>
  </div>

  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
